name: Build Texture Sizing Bank

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-texture-sizing-bank.yml"
      - "scripts/generate-texture-sizing-bank.mjs"

permissions:
  contents: write

concurrency:
  group: texture-sizing-bank
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout pinned DCFR-SOLVER
        run: |
          mkdir -p .stackup
          git clone https://github.com/exinori/DCFR-SOLVER.git .stackup/DCFR-SOLVER
          git -C .stackup/DCFR-SOLVER checkout 4ade6a9e15a841c41867afde1258b9d110cd6fb1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".stackup/DCFR-SOLVER -> target"

      - name: Build DCFR-SOLVER
        run: |
          cargo build --release --manifest-path .stackup/DCFR-SOLVER/Cargo.toml --bin dcfr-solver
          cp .stackup/DCFR-SOLVER/target/release/dcfr-solver .stackup/dcfr-solver
          chmod +x .stackup/dcfr-solver

      - name: Generate targeted texture and sizing solves
        env:
          STACKUP_DCFR_BIN: ${{ github.workspace }}/.stackup/dcfr-solver
          STACKUP_TEXTURE_ITERATIONS: "120"
        run: node scripts/generate-texture-sizing-bank.mjs

      - name: Validate targeted bank
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/solver/texture-sizing.json','utf8'));
          if(d.upstream?.commit!=='4ade6a9e15a841c41867afde1258b9d110cd6fb1')throw new Error('upstream pin drift');
          const tags=new Set((d.spots||[]).flatMap(s=>s.scenario?.tags||[]));
          const required=['board_paired','board_monotone','board_low','bet_25','bet_50','bet_66','bet_75','pot_bet','overbet_125','overbet_150'];
          const solvedByTag={};
          for(const s of d.spots||[]){
            if(!Array.isArray(s.strategy)||s.strategy.length<250)throw new Error('insufficient solved hands '+s.id);
            for(const tag of s.scenario?.tags||[])solvedByTag[tag]=(solvedByTag[tag]||0)+s.strategy.length;
          }
          for(const tag of required){
            if(!tags.has(tag))throw new Error('missing targeted solve '+tag);
            if((solvedByTag[tag]||0)<1500)throw new Error(tag+' below strict 1500 floor: '+String(solvedByTag[tag]||0));
          }
          if((d.failures?.length||0)>2)throw new Error('too many texture/sizing failures: '+d.failures.length);
          console.log({spots:d.spots.length,failures:d.failures?.length||0,solvedByTag});
          NODE

      - name: Recompute strict coverage and deficit queue
        run: |
          node scripts/audit-scenario-coverage.mjs
          node scripts/plan-solved-spot-growth.mjs

      - name: Commit bank and coverage safely
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "StackUp Texture Bot"
          git config user.email "actions@users.noreply.github.com"
          cp data/solver/texture-sizing.json /tmp/texture-sizing.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/texture-sizing.json data/solver/texture-sizing.json
          node scripts/audit-scenario-coverage.mjs
          node scripts/plan-solved-spot-growth.mjs
          git add data/solver/texture-sizing.json data/solver/coverage.json data/solver/growth-plan.json data/solver/generation-queue.json
          if git diff --cached --quiet; then
            echo "Texture/sizing bank unchanged."
            exit 0
          fi
          git commit -m "Generate targeted DCFR texture sizing bank"
          git push origin HEAD:main
