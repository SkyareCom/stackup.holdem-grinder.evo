name: Audit Solved Core Migration
on:
  pull_request:
    paths:
      - 'scripts/audit-solved-core-migration.mjs'
      - 'core/stackup-solved-spot-contract.js'
      - 'data/solver/**'
      - '.github/workflows/audit-solved-core-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict migration audit
        run: node scripts/audit-solved-core-migration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: solved-core-migration-audit
          path: data/solver/solved-core-migration-audit.json
          retention-days: 14

  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: audit
    runs-on: ubuntu-latest
    env:
      SOLVED_SPOT_SUPABASE_URL: ${{ secrets.SOLVED_SPOT_SUPABASE_URL }}
      SOLVED_SPOT_SUPABASE_SERVICE_KEY: ${{ secrets.SOLVED_SPOT_SUPABASE_SERVICE_KEY }}
      SOLVED_SPOT_BUCKET: solved-spots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require server-only credentials
        run: |
          test -n "$SOLVED_SPOT_SUPABASE_URL"
          test -n "$SOLVED_SPOT_SUPABASE_SERVICE_KEY"
      - name: Package strictly validated banks
        run: node scripts/package-solved-core-banks.mjs
      - name: Upload and verify SHA parity
        run: node scripts/upload-solved-core-banks.mjs
