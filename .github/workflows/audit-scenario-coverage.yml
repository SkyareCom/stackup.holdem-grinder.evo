name: Audit Scenario Coverage

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-scenario-coverage.yml"
      - "scripts/audit-scenario-coverage.mjs"
      - "scripts/plan-solved-spot-growth.mjs"
      - "core/stackup-scenario-catalog.js"
      - "core/stackup-solved-spot-contract.js"
      - "data/solver/solved-spot-policy.json"
      - "data/solver/preflop.json"
      - "data/solver/postflop.json"
      - "data/solver/tournament.json"
      - "data/solver/pushfold-hu-v1.json"
      - "data/solver/preflop-decisions.json"
      - "data/solver/preflop-9max.json"
      - "data/solver/texture-sizing.json"
      - "data/solver/line-bank.json"

permissions:
  contents: write

concurrency:
  group: scenario-coverage
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Audit 162 training cards with strict solved-spot contract
        run: |
          node scripts/audit-scenario-coverage.mjs
          node scripts/plan-solved-spot-growth.mjs

      - name: Validate coverage contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('data/solver/coverage.json','utf8'));
          if(c.mode!=='STRICT_SOLVED_ONLY')throw new Error('strict solved-only coverage required');
          if(c.minSpots!==1500)throw new Error('coverage floor must remain 1500');
          if(c.currentGoal!==2000)throw new Error('current solved-spot goal must be 2000');
          if(c.longTermTarget!==20000)throw new Error('long-term solved-spot target must be 20000');
          if(c.counts.adjust!==58||c.counts.advance!==104||c.counts.total!==162){
            throw new Error('scenario catalog count drift: '+JSON.stringify(c.counts));
          }
          if(!Array.isArray(c.cards)||c.cards.length!==162)throw new Error('coverage card list must have 162 entries');
          for(const card of c.cards){
            if(card.available!==card.validatedSolvedSpots)throw new Error('presentation inflation detected: '+card.section+'/'+card.id);
            if(card.targetSpots!==2000)throw new Error('card target drift: '+card.section+'/'+card.id);
          }
          console.log({publishable:c.publishable,incomplete:c.incomplete,minSpots:c.minSpots,currentGoal:c.currentGoal,longTermTarget:c.longTermTarget});
          NODE

      - name: Commit coverage audit safely
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "StackUp Coverage Bot"
          git config user.email "actions@users.noreply.github.com"

          # Coverage is derived data. Always recompute it on the newest main
          # instead of rebasing an old generated JSON over a concurrent bot commit.
          git fetch origin main
          git reset --hard origin/main
          node scripts/audit-scenario-coverage.mjs
          node scripts/plan-solved-spot-growth.mjs

          git add data/solver/coverage.json data/solver/growth-plan.json data/solver/generation-queue.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged."
            exit 0
          fi
          git commit -m "Audit solver coverage for all training cards"
          git push origin HEAD:main
