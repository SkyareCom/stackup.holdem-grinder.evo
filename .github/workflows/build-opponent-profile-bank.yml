name: Build Opponent Profile Bank

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-opponent-profile-bank.yml"
      - "scripts/generate-opponent-profile-bank.py"
      - "data/solver/opponent-profile-calibration.json"
      - "data/solver/pushfold-hu-v1.json"

permissions:
  contents: write

concurrency:
  group: opponent-profile-bank
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check numpy

      - name: Download pinned MIT equity matrix
        run: |
          mkdir -p .stackup
          curl --fail --location --retry 3             https://raw.githubusercontent.com/amaster97/poker_solver/f78f1b2bc338dd8cbb5226ecb8398bbdb3635676/assets/preflop_equity_169x169.npz             --output .stackup/preflop_equity_169x169.npz

      - name: Generate exact fixed-policy best responses
        env:
          STACKUP_PREFLOP_EQUITY: ${{ github.workspace }}/.stackup/preflop_equity_169x169.npz
        run: python scripts/generate-opponent-profile-bank.py

      - name: Validate all profile decisions
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const code=fs.readFileSync('core/stackup-solved-spot-contract.js','utf8');
          const fake={};new Function('window','globalThis',code)(fake,fake);
          const d=JSON.parse(fs.readFileSync('data/solver/opponent-profile.json','utf8'));
          const counts={opp50:0,opp60:0,opp75:0,opp40:0};
          for(const s of d.spots||[])for(const h of s.strategy||[]){
            const v=fake.StackUpSolvedSpotContract.validateSolvedDecision(s,h);
            if(!v.ok)throw new Error(s.id+'/'+h.hand+': '+v.errors.join(','));
            if(s.scenario?.opponentProfile in counts)counts[s.scenario.opponentProfile]++;
          }
          for(const [k,n] of Object.entries(counts))if(n<2000)throw new Error(k+' below current 2000 goal: '+n);
          console.log(counts);
          NODE

      - name: Recompute strict coverage
        run: |
          node scripts/audit-scenario-coverage.mjs
          node scripts/plan-solved-spot-growth.mjs
          node scripts/route-solve-queue.mjs

      - name: Commit profile bank safely
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "StackUp Profile Bot"
          git config user.email "actions@users.noreply.github.com"
          cp data/solver/opponent-profile.json /tmp/opponent-profile.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/opponent-profile.json data/solver/opponent-profile.json
          node scripts/audit-scenario-coverage.mjs
          node scripts/plan-solved-spot-growth.mjs
          node scripts/route-solve-queue.mjs
          git add data/solver/opponent-profile.json data/solver/coverage.json data/solver/growth-plan.json data/solver/generation-queue.json data/solver/solve-route-plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate opponent profile best-response bank"
          git push origin HEAD:main
