name: Validate Solved Spot Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - "core/stackup-solved-spot-contract.js"
      - "core/stackup-solved-spot-classifier.js"
      - "core/stackup-training-sequencer.js"
      - "core/stackup-spots-client.js"
      - "scripts/*.mjs"
      - "scripts/*.py"
      - "scripts/stackup-preflop-export.rs"
      - "data/solver/solved-spot-policy.json"
      - ".github/workflows/*.yml"

permissions:
  contents: read

concurrency:
  group: validate-solved-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JavaScript and ESM syntax
        run: |
          node --check core/stackup-solved-spot-contract.js
          node --check core/stackup-solved-spot-classifier.js
          node --check core/stackup-training-sequencer.js
          node --check core/stackup-spots-client.js
          node --check scripts/audit-scenario-coverage.mjs
          node --check scripts/plan-solved-spot-growth.mjs
          node --check scripts/route-solve-queue.mjs
          node --check scripts/generate-line-bank.mjs
          node --check scripts/generate-solver-bank.mjs
          node --check scripts/generate-texture-sizing-bank.mjs
          bash -n scripts/persist-solver-artifacts.sh

      - name: Validate runtime / audit solved-bank parity
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const client=fs.readFileSync('core/stackup-spots-client.js','utf8');
          const sequencer=fs.readFileSync('core/stackup-training-sequencer.js','utf8');
          const audit=fs.readFileSync('scripts/audit-scenario-coverage.mjs','utf8');
          const banks=[
            ['reentry','reentry.json'],
            ['opponentProfile','opponent-profile.json'],
            ['multiwayTournament','multiway-tournament.json'],
            ['multiwayPostflop','multiway-postflop.json'],
            ['preflopMultistack','preflop-multistack.json'],
            ['preflopHu','preflop-hu.json'],
            ['preflopDecisions','preflop-decisions.json'],
            ['preflop9max','preflop-9max.json'],
            ['textureSizing','texture-sizing.json'],
            ['lineBank','line-bank.json']
          ];
          for(const [key,file] of banks){
            if(!client.includes("file:'"+file+"'"))throw new Error('runtime client missing '+file);
            if(!sequencer.includes('bank?.'+key+'?.spots'))throw new Error('sequencer missing '+key);
            if(!audit.includes(key+'?.spots'))throw new Error('coverage auditor missing '+key);
          }
          console.log({runtimeAuditParity:true,banks:banks.length});
          NODE

      - name: Guard strict no-projection runtime
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['core/stackup-training-sequencer.js','scripts/audit-scenario-coverage.mjs']){
            const text=fs.readFileSync(file,'utf8');
            for(const forbidden of ['contextProjection','positionProjection','6MAX_UTG_TO_9MAX_LJ','position-equivalence']){
              if(text.includes(forbidden))throw new Error(file+' contains forbidden solved-spot projection marker '+forbidden);
            }
          }
          console.log({strictNoProjection:true});
          NODE

      - name: Validate Python generators and patchers
        run: |
          python -m py_compile scripts/generate-tournament-bank.py
          python -m py_compile scripts/patch-dcfr-9max.py
          python -m py_compile scripts/patch-dcfr-stack.py
          python -m py_compile scripts/patch-dcfr-hu.py
          python -m py_compile scripts/generate-reentry-bank.py
          python -m py_compile scripts/generate-opponent-profile-bank.py
          python -m py_compile scripts/generate-multiway-tournament-bank.py
          python -m py_compile scripts/generate-multiway-postflop-bank.py

      - name: Validate solved-spot policy and bank envelopes
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const policy=JSON.parse(fs.readFileSync('data/solver/solved-spot-policy.json','utf8'));
          if(policy.mode!=='STRICT_SOLVED_ONLY')throw new Error('strict policy required');
          if(policy.publishFloor!==1500||policy.currentGoal!==2000)throw new Error('target drift');
          if(policy.growth?.longTermTargetPerFilter!==20000)throw new Error('20k target drift');
          for(const file of [
            'data/solver/preflop-9max.json',
            'data/solver/preflop-multistack.json',
            'data/solver/preflop-hu.json',
            'data/solver/reentry.json',
            'data/solver/opponent-profile.json',
            'data/solver/multiway-tournament.json',
            'data/solver/multiway-postflop.json',
            'data/solver/line-bank.json',
            'data/solver/tournament.json',
            'data/solver/texture-sizing.json'
          ]){
            const d=JSON.parse(fs.readFileSync(file,'utf8'));
            if(!d||typeof d!=='object')throw new Error('invalid json '+file);
          }
          console.log({strict:true,publishFloor:policy.publishFloor,currentGoal:policy.currentGoal,longTerm:policy.growth.longTermTargetPerFilter});
          NODE

      - name: Validate strategic decision identity
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const code=fs.readFileSync('core/stackup-solved-spot-contract.js','utf8');
          const fake={};new Function('window','globalThis',code)(fake,fake);
          const contract=fake.StackUpSolvedSpotContract;
          if(typeof contract.strategicDecisionId!=='function')throw new Error('strategicDecisionId unavailable');
          const entry={hand:'AA',actions:[{kind:'raise',action:'RAISE',frequency:100}]};
          const scenario={
            gameType:'CASH',street:'PRE-FLOP',tableSize:6,
            positions:['UTG','HJ','CO','BTN','SB','BB'],
            heroPosition:'UTG',villainPosition:'BB',
            effectiveStack:50,heroStack:50,
            playerStacks:{UTG:50,HJ:50,CO:50,BTN:50,SB:49.5,BB:49},
            pot:1.5,currentBet:1,board:[],actionHistory:[]
          };
          const a={solver:'DCFR_SOLVER',solveId:'run-cash',scenario,strategy:[entry]};
          const b={solver:'DCFR_SOLVER',solveId:'run-mtt',scenario:{...scenario,gameType:'TOURNAMENT',phase:'EARLY',fieldSize:'500',tournamentType:'REGULAR'},strategy:[entry]};
          const provenanceA=contract.solvedDecisionId(a,entry);
          const provenanceB=contract.solvedDecisionId(b,entry);
          const strategicA=contract.strategicDecisionId(a,entry);
          const strategicB=contract.strategicDecisionId(b,entry);
          if(provenanceA===provenanceB)throw new Error('provenance ids should remain distinct');
          if(strategicA!==strategicB)throw new Error('cash/mtt label duplicate was not deduplicated');
          const icm={...b,solveId:'run-icm',scenario:{...b.scenario,payouts:[0.5,0.3,0.2,0,0,0]}};
          if(contract.strategicDecisionId(icm,entry)===strategicB)throw new Error('ICM payout state must remain strategically distinct');
          console.log({strategicIdentity:true,provenanceDistinct:true,contextLabelsDeduplicated:true,icmDistinct:true});
          NODE

      - name: Run strict coverage audit
        run: |
          node scripts/audit-scenario-coverage.mjs
          node scripts/plan-solved-spot-growth.mjs
          node scripts/route-solve-queue.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/solver/solve-route-plan.json','utf8'));
          if(r.counts.unrouted!==0)throw new Error('unrouted deficits: '+r.counts.unrouted);
          if(r.counts.engineRequired!==0)throw new Error('engines still required: '+r.counts.engineRequired);
          console.log({readyToSolve:r.counts.readyToSolve,engineRequired:r.counts.engineRequired,unrouted:r.counts.unrouted});
          NODE
