name: Migrate Validated Solved Banks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    if: github.repository == 'SkyareCom/stackup.holdem-grinder.evo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: solved-spots-production
    env:
      SOLVED_SPOT_SUPABASE_URL: ${{ secrets.SOLVED_SPOT_SUPABASE_URL }}
      SOLVED_SPOT_SUPABASE_SERVICE_KEY: ${{ secrets.SOLVED_SPOT_SUPABASE_SERVICE_KEY }}
      SOLVED_SPOT_BUCKET: solved-spots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require server-only credentials
        run: |
          test -n "$SOLVED_SPOT_SUPABASE_URL"
          test -n "$SOLVED_SPOT_SUPABASE_SERVICE_KEY"
      - name: Strict audit
        run: node scripts/audit-solved-core-migration.mjs
      - name: Package validated banks
        run: node scripts/package-solved-core-banks.mjs
      - name: Build deterministic decision catalog
        run: node scripts/build-solved-core-catalog.mjs
      - name: Automated strict contract audit (not solver certification)
        run: node scripts/approve-solved-core-automatically.mjs
      - name: Require independent solver replay certificate
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('.solved-core/approval.json','utf8'));
          if(a.audit_mode!=='INDEPENDENT_SOLVER_REPLAY'||a.solver_replay?.status!=='PASSED'||!a.solver_replay?.report_sha256||!a.solver_replay?.verifier_commit){
            throw new Error('Production blocked: independent solver replay certificate is missing');
          }
          NODE
      - name: Upload and verify parity
        run: node scripts/upload-solved-core-banks.mjs
