name: Build Strict Solved Line Bank

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-line-bank.yml"
      - "scripts/generate-line-bank.mjs"
      - "core/stackup-solved-spot-contract.js"
      - "data/solver/solved-spot-policy.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-line-bank.yml"
      - "scripts/generate-line-bank.mjs"
      - "core/stackup-solved-spot-contract.js"
      - "data/solver/solved-spot-policy.json"

permissions:
  contents: write

concurrency:
  group: strict-solved-line-bank-${{ github.ref }}
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        runout: [a, b, c, d, e, f, g, h, i, j, k, l, m, n, o, p, q, r, s, t]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout pinned DCFR-SOLVER
        run: |
          mkdir -p .stackup
          git clone https://github.com/exinori/DCFR-SOLVER.git .stackup/DCFR-SOLVER
          git -C .stackup/DCFR-SOLVER checkout 4ade6a9e15a841c41867afde1258b9d110cd6fb1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".stackup/DCFR-SOLVER -> target"
          shared-key: strict-line-bank

      - name: Build DCFR-SOLVER
        run: |
          cargo build --release --manifest-path .stackup/DCFR-SOLVER/Cargo.toml --bin dcfr-solver
          cp .stackup/DCFR-SOLVER/target/release/dcfr-solver .stackup/dcfr-solver
          chmod +x .stackup/dcfr-solver

      - name: Generate one solved line runout
        env:
          STACKUP_DCFR_BIN: ${{ github.workspace }}/.stackup/dcfr-solver
          STACKUP_LINE_ITERATIONS: "160"
          STACKUP_LINE_RUNOUT_ID: ${{ matrix.runout }}
          STACKUP_LINE_OUT: ".stackup/line-out/line-${{ matrix.runout }}.json"
        run: node scripts/generate-line-bank.mjs

      - name: Validate generated decisions for runout
        env:
          RUNOUT: ${{ matrix.runout }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const file='.stackup/line-out/line-'+process.env.RUNOUT+'.json';
          const code=fs.readFileSync('core/stackup-solved-spot-contract.js','utf8');
          const fake={};new Function('window','globalThis',code)(fake,fake);
          const bank=JSON.parse(fs.readFileSync(file,'utf8'));
          let valid=0;
          for(const spot of bank.spots||[])for(const entry of spot.strategy||[]){
            const result=fake.StackUpSolvedSpotContract.validateSolvedDecision(spot,entry);
            if(!result.ok)throw new Error(spot.id+'/'+entry.hand+': '+result.errors.join(','));
            valid++;
          }
          if(!Array.isArray(bank.spots))throw new Error('runout '+process.env.RUNOUT+' did not emit a spots array');
          if(bank.upstream?.commit!=='4ade6a9e15a841c41867afde1258b9d110cd6fb1')throw new Error('runout '+process.env.RUNOUT+' upstream pin drift');
          console.log({runout:process.env.RUNOUT,spots:bank.spots.length,valid,failures:bank.failures?.length||0});
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: "line-runout-${{ matrix.runout }}"
          path: ".stackup/line-out/line-${{ matrix.runout }}.json"
          retention-days: 1

  aggregate:
    needs: solve
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: line-runout-*
          path: .stackup/line-in
          merge-multiple: true

      - name: Merge solved line shards
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='.stackup/line-in';
          const files=fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort();
          if(files.length!==20)throw new Error('expected 20 line runout shards, found '+files.length);
          const spots=[],failures=[],ids=new Set(),runouts=[];
          let first=null,iterations=Infinity;
          for(const file of files){
            const d=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
            first=first||d;
            iterations=Math.min(iterations,Number(d.iterations)||0);
            const runout=file.match(/line-([a-t])\.json$/)?.[1]||file;
            runouts.push(runout);
            for(const spot of d.spots||[]){
              if(ids.has(spot.id))throw new Error('duplicate line spot '+spot.id);
              ids.add(spot.id);spots.push(spot);
            }
            for(const failure of d.failures||[])failures.push(failure);
          }
          const payload={
            schemaVersion:1,
            generatedAt:new Date().toISOString(),
            solver:'DCFR_SOLVER',
            upstream:first.upstream,
            iterations,
            baseMatchups:first.baseMatchups,
            runouts,
            spots,
            failures
          };
          fs.writeFileSync('data/solver/line-bank.json',JSON.stringify(payload));
          console.log({shards:files.length,spots:spots.length,failures:failures.length});
          NODE

      - name: Record aggregate provenance and SHA-256
        run: |
          sha256sum data/solver/line-bank.json | tee line-bank.sha256
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const p='data/solver/line-bank.json';
          const raw=fs.readFileSync(p);
          const bank=JSON.parse(raw);
          if(!Array.isArray(bank.runouts)||bank.runouts.length!==20)throw Error('aggregate_runouts_incomplete');
          if(!Array.isArray(bank.spots)||bank.spots.length===0)throw Error('aggregate_empty');
          if(bank.upstream?.commit!=='4ade6a9e15a841c41867afde1258b9d110cd6fb1')throw Error('upstream_pin_drift');
          const evidence={schemaVersion:1,runId:process.env.GITHUB_RUN_ID,sourceCommit:process.env.GITHUB_SHA,upstreamCommit:bank.upstream.commit,iterations:bank.iterations,runouts:bank.runouts,spots:bank.spots.length,sha256:crypto.createHash('sha256').update(raw).digest('hex'),certification:'NOT_CERTIFIED'};
          fs.writeFileSync('line-bank-provenance.json',JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Verify aggregate provenance
        run: node scripts/verify-dcfr-line-aggregate.mjs

      - name: Preserve aggregated solver output
        uses: actions/upload-artifact@v4
        with:
          name: dcfr-line-bank-aggregate-${{ github.run_id }}
          path: |
            data/solver/line-bank.json
            line-bank.sha256
            line-bank-provenance.json
          retention-days: 90
          if-no-files-found: error

      - name: Validate all strict line families
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const code=fs.readFileSync('core/stackup-solved-spot-contract.js','utf8');
          const fake={};new Function('window','globalThis',code)(fake,fake);
          const contract=fake.StackUpSolvedSpotContract;
          const bank=JSON.parse(fs.readFileSync('data/solver/line-bank.json','utf8'));
          if(bank.upstream?.commit!=='4ade6a9e15a841c41867afde1258b9d110cd6fb1')throw new Error('upstream pin drift');
          if(!Array.isArray(bank.spots)||bank.spots.length<40)throw new Error('line bank too small');
          let valid=0;
          const byTag={};
          const canonicalSeen=new Set();
          const tagUnique=new Map();
          let canonicalDuplicates=0;
          for(const spot of bank.spots){
            let spotValid=0;
            for(const entry of spot.strategy||[]){
              const result=contract.validateSolvedDecision(spot,entry);
              if(!result.ok)throw new Error(spot.id+'/'+entry.hand+': '+result.errors.join(','));
              valid++;spotValid++;
              const key=JSON.stringify([result.scenarioFingerprint,String(entry.hand||'').trim().toUpperCase()]);
              if(canonicalSeen.has(key))canonicalDuplicates++;
              else canonicalSeen.add(key);
              for(const tag of spot.scenario?.tags||[]){
                if(!tagUnique.has(tag))tagUnique.set(tag,new Set());
                tagUnique.get(tag).add(key);
              }
            }
            for(const tag of spot.scenario?.tags||[])byTag[tag]=(byTag[tag]||0)+spotValid;
          }
          const required=[
            'donk_bet','check_back_flop','miss_cbet','check_raise',
            'probe_bet','vs_missed_cbet','delayed_cbet','double_barrel',
            'triple_barrel','float_flop','sequential_lines','turn_check_raise',
            'block_bet_20_25','river_bluff_catch','river_check_raise','bet_fold',
            'vs_overbet'
          ];
          const byTagCanonical=Object.fromEntries([...tagUnique].map(([tag,keys])=>[tag,keys.size]));
          console.log({rootNodes:bank.spots.length,validatedSolvedDecisions:valid,canonicalUniqueDecisions:canonicalSeen.size,canonicalDuplicates,byTag,byTagCanonical,failures:bank.failures?.length||0});
          if(valid<6000)throw new Error('line bank has fewer than 6000 validated solved decisions: '+valid);
          const deficits=required.filter(tag=>(byTagCanonical[tag]||0)<1500).map(tag=>({tag,solved:byTagCanonical[tag]||0,deficit:1500-(byTagCanonical[tag]||0)}));
          if(canonicalDuplicates)throw new Error('duplicate canonical scenario+hand decisions: '+canonicalDuplicates);
          if(deficits.length)throw new Error('strict line-family deficits '+JSON.stringify(deficits));
          NODE

      - name: Recompute strict coverage and deficit queue
        run: |
          node scripts/audit-scenario-coverage.mjs
          node scripts/plan-solved-spot-growth.mjs
          node scripts/route-solve-queue.mjs

      - name: Commit bank, coverage and queue safely
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "StackUp Solved Spot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/solver/line-bank.json
          git commit -m "Generate strict solved postflop line bank"
          bash scripts/persist-solver-artifacts.sh data/solver/line-bank.json
