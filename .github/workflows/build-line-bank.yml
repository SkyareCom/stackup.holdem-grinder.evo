name: Build Strict Solved Line Bank

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-line-bank.yml"
      - "scripts/generate-line-bank.mjs"
      - "core/stackup-solved-spot-contract.js"
      - "data/solver/solved-spot-policy.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-line-bank.yml"
      - "scripts/generate-line-bank.mjs"
      - "core/stackup-solved-spot-contract.js"
      - "data/solver/solved-spot-policy.json"

permissions:
  contents: write

concurrency:
  group: strict-solved-line-bank-refs/heads/main
  cancel-in-progress: true

jobs:
  cancel_stale:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release stale main line-bank concurrency group"
