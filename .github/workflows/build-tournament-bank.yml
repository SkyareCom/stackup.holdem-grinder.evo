name: Build Tournament Bank

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-tournament-bank.yml"
      - "scripts/generate-tournament-bank.py"
      - "core/stackup-tournament-math.js"
      - "core/stackup-scenario-catalog.js"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-tournament-bank.yml"
      - "scripts/generate-tournament-bank.py"
      - "core/stackup-tournament-math.js"
      - "core/stackup-scenario-catalog.js"

permissions:
  contents: write

concurrency:
  group: tournament-bank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numeric runtime
        run: python -m pip install --disable-pip-version-check numpy

      - name: Download pinned MIT preflop equity matrix
        run: |
          mkdir -p .stackup
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/amaster97/poker_solver/f78f1b2bc338dd8cbb5226ecb8398bbdb3635676/assets/preflop_equity_169x169.npz \
            --output .stackup/preflop_equity_169x169.npz
          test -s .stackup/preflop_equity_169x169.npz

      - name: Validate generator syntax
        run: python -m py_compile scripts/generate-tournament-bank.py

      - name: Generate exact-ICM tournament bank
        env:
          STACKUP_PREFLOP_EQUITY: ${{ github.workspace }}/.stackup/preflop_equity_169x169.npz
          STACKUP_ICM_ITERATIONS: "8000"
          STACKUP_ICM_MAX_NASHCONV: "0.0015"
        run: python scripts/generate-tournament-bank.py

      - name: Validate tournament bank
        run: |
          python - <<'PY'
          import json, math
          p=json.load(open("data/solver/tournament.json","r",encoding="utf-8"))
          spots=p.get("spots",[])
          assert spots, "tournament bank empty"
          gate=float(p["maxNashConv"])
          by_tag={}
          by_table={}
          for s in spots:
              nc=float(s["convergence"]["nashConv"])
              assert math.isfinite(nc) and nc <= gate, (s["id"],nc,gate)
              solved=len(s.get("strategy",[]))
              assert solved == 169, s["id"]
              scenario=s.get("scenario",{})
              for tag in scenario.get("tags",[]):
                  by_tag[tag]=by_tag.get(tag,0)+solved
              table=int(scenario.get("trainingTableSize",scenario.get("tableSize",0)) or 0)
              by_table[table]=by_table.get(table,0)+solved
          targets=["reshove","icm_5_8","icm_9_12","icm_13_18","icm_19_25","icm_final_table","icm_3handed"]
          for tag in targets:
              assert by_tag.get(tag,0) >= 2000, (tag,by_tag.get(tag,0))
          assert by_table.get(10,0) >= 2000, ("s10",by_table.get(10,0))
          assert by_tag.get("covered_stack",0) >= 2000, ("covered_stack",by_tag.get("covered_stack",0))
          print({"spots":len(spots),"rejected":len(p.get("rejected",[])),"gate":gate,
                 "targets":{tag:by_tag.get(tag,0) for tag in targets},
                 "s10":by_table.get(10,0),"covered_stack":by_tag.get("covered_stack",0)})
          PY

      - name: Audit all 162 scenario cards
        run: |
          node scripts/audit-scenario-coverage.mjs
          node scripts/plan-solved-spot-growth.mjs
          node scripts/route-solve-queue.mjs

      - name: Commit tournament bank and coverage
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "StackUp Tournament Bot"
          git config user.email "actions@users.noreply.github.com"

          # Preserve the validated bank, then move onto the newest main so
          # concurrent coverage/DCFR bot commits cannot create a rebase conflict.
          cp data/solver/tournament.json /tmp/stackup-tournament.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/stackup-tournament.json data/solver/tournament.json

          # Coverage must be recomputed against the newest versions of every bank.
          node scripts/audit-scenario-coverage.mjs

          git add data/solver/tournament.json data/solver/coverage.json data/solver/growth-plan.json data/solver/generation-queue.json data/solver/solve-route-plan.json
          if git diff --cached --quiet; then
            echo "Tournament bank unchanged."
            exit 0
          fi
          git commit -m "Generate exact-ICM tournament bank"
          bash scripts/persist-solver-artifacts.sh data/solver/tournament.json
