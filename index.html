:root{--brush:'Bebrush',sans-serif;--bubble:var(--brush)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{color-scheme:dark;background:#1a1a1a}
body{background:#1a1a1a;color:#fff;display:flex;justify-content:center;align-items:center;font-family:'Bebrush',sans-serif;-webkit-tap-highlight-color:transparent}
.screen{position:relative;width:100%;max-width:430px;height:100%;max-height:932px;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 24px);
  background:#9c9a95}
@media(min-width:500px){.screen{border-radius:44px;box-shadow:0 0 0 10px #0c0c0c,0 30px 80px rgba(0,0,0,.6)}}
/* ---- Concreto ---- */
.concrete{position:fixed;inset:0;z-index:0;pointer-events:none}
.concrete svg{width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.45) 100%)}
.content{position:relative;z-index:1;width:100%;min-height:100%;display:flex;flex-direction:column;align-items:center}
/* ---- Topo ---- */
.top{width:100%;display:flex;justify-content:flex-end;position:relative;z-index:10}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:2px solid rgba(255,255,255,.85);background:rgba(20,20,20,.55);color:#fff;font:400 16px var(--bubble);letter-spacing:1px;cursor:pointer;backdrop-filter:blur(4px)}
.lang-btn svg{width:18px;height:18px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#141414;border:2px solid #fff;border-radius:14px;overflow:hidden;display:none;min-width:160px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px;background:none;border:0;color:#fff;font:400 15px var(--brush);cursor:pointer}
.menu button:hover,.menu button.on{background:#2c2c2c}
/* ---- Título ---- */
.title{margin-top:1.2vh;font-family:var(--brush);font-size:clamp(80px,25vw,110px);line-height:1;color:#111;letter-spacing:2px;
  text-shadow:0 1px 0 rgba(255,255,255,.35),0 0 1px #000;transform:rotate(-3deg);mix-blend-mode:multiply}
.tag{margin-top:8px;font-family:var(--brush);font-size:15px;color:#f2f0ec;background:#111;padding:5px 14px;white-space:nowrap;font-size:clamp(11px,3.4vw,15px) !important;transform:rotate(-2deg);letter-spacing:.5px}
/* ---- Boas-vindas ---- */
.welcome{margin-top:3.2vh;text-align:center}
.welcome h2{font-family:var(--brush);font-size:36px;color:#111;letter-spacing:2px;font-weight:400}
.welcome p{margin-top:4px;font:400 11px var(--brush);letter-spacing:3px;color:#222;text-transform:uppercase}
.suits{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px;color:#111;font-size:15px}
.suits i{display:block;width:70px;height:2px;background:#111;opacity:.6}
.suits span.r{color:#8e1f16}
/* ---- Botões ---- */
.actions{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:4vh}
.btn{display:flex;align-items:center;gap:14px;width:100%;min-height:74px;padding:10px 16px 10px 12px;border-radius:18px;border:2px solid rgba(255,255,255,.9);background:rgba(16,16,16,.92);color:#fff;
  text-align:left;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.35),0 12px 26px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.3)}
.ic{flex:none;width:clamp(42px,12vw,50px);height:clamp(42px,12vw,50px);border-radius:50%;display:grid;place-items:center;background:#000;border:2px solid #fff}
.ic svg{width:28px;height:28px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txt b{font-family:var(--bubble);letter-spacing:.3px;font-weight:400;font-size:clamp(16px,4.8vw,20px);letter-spacing:.5px;line-height:1.1}
.txt small{font:400 15px var(--brush);opacity:.75;letter-spacing:.5px}
.chev{flex:none;width:22px;height:22px}
.btn.primary{background:#f2f0ec;color:#111;border-color:#111}
.btn.primary .ic{background:#111;color:#fff;border-color:#111}
.btn.wa .ic{border-color:#25D366}
/* ---- Logo ---- */
.logo{margin-top:.5vh;width:min(52vw,210px);aspect-ratio:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.logo img{width:100%;height:100%}
.legal{margin-top:auto;padding-top:16px;letter-spacing:.5px;font-size:11px;color:#2a2a2a;text-align:center;opacity:.8}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font:400 14px var(--brush);opacity:0;transition:.25s;z-index:5;border:1px solid #444;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---- Toques da referência: roxo + dourado ---- */
:root{--roxo:#7b2ff7;--roxo2:#4b12b8;--ouro:#f0a93b}
.btn{border:1.5px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(38,36,42,.95),rgba(14,13,16,.95));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.45)}
.btn.primary{background:linear-gradient(135deg,#8d45ff 0%,var(--roxo) 45%,var(--roxo2) 100%);color:#fff;border:1.5px solid #b98cff;
  box-shadow:0 0 0 1px rgba(123,47,247,.4),0 0 26px rgba(123,47,247,.65),0 10px 24px rgba(0,0,0,.45)}
.btn.primary .ic{background:rgba(20,6,50,.55);border-color:#c9a6ff}
.btn .ic{background:#0b0b0d;border:2px solid rgba(255,255,255,.25)}
.btn.wa .ic{border-color:#25D366;box-shadow:0 0 12px rgba(37,211,102,.45)}
.btn:active{transform:translateY(2px) scale(.99)}
.suits i{background:linear-gradient(90deg,transparent,var(--roxo));opacity:1}
.suits i:last-child{background:linear-gradient(90deg,var(--roxo),transparent)}
.suits span{color:var(--roxo)} .suits span.r{color:var(--roxo)} .suits span:nth-of-type(4){color:var(--ouro)}
.tag{background:#111;color:#fff;border:1.5px solid var(--ouro);box-shadow:0 0 14px rgba(240,169,59,.45)}
.logo{position:relative}

.legal a{color:var(--roxo2);font-weight:700;text-decoration:none}
.lang-btn{border-color:var(--roxo);box-shadow:0 0 14px rgba(123,47,247,.5)}
</style>

<script>
(function(){
  const tag=document.querySelector('.tag'),box=document.querySelector('.content');
  function fit(){
    if(!tag||!box)return;
    const avail=box.clientWidth-20;               // largura útil com folga
    tag.style.setProperty('font-size','14px','important');
    tag.style.setProperty('max-width','none','important');
    const nat=tag.getBoundingClientRect().width;
    let size=14;
    if(nat>avail) size=Math.max(9,Math.floor(14*avail/nat*10)/10);
    tag.style.setProperty('font-size',size+'px','important');
    tag.style.setProperty('max-width',avail+'px','important');
    let guard=40;while(tag.scrollWidth>tag.clientWidth+1&&guard--){size-=.3;tag.style.setProperty('font-size',size+'px','important');}
  }
  window.__fitTag=fit;
  window.addEventListener('resize',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(box);
  new MutationObserver(fit).observe(tag,{childList:true,characterData:true,subtree:true});
  if(document.fonts){document.fonts.load("14px Bebrush").then(fit).catch(()=>{});document.fonts.ready.then(fit);}
  [0,200,800,2000].forEach(t=>setTimeout(fit,t));
})();
</script>
