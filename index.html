<style id="grinderSplashStyle">
/* ===== GRINDER animated splash — isolated from the app ===== */
@font-face{font-family:'GrinderSplashBrush';src:url('assets/bebrush.otf') format('opentype');font-display:block}
@font-face{font-family:'GrinderSplashRage';src:url('assets/road-rage.woff2') format('woff2');font-display:block}

#grinderSplash{
  position:fixed;inset:0;z-index:2147483647;
  width:100%;height:100vh;height:100dvh;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,
    rgb(0,0,0) 0%,rgb(0,1,2) 10%,rgb(0,2,5) 20%,rgb(1,3,8) 30%,
    rgb(1,4,12) 40%,rgb(2,5,16) 50%,rgb(2,7,21) 60%,rgb(2,9,26) 70%,
    rgb(3,10,31) 80%,rgb(3,12,36) 90%,rgb(4,14,42) 100%);
  opacity:1;isolation:isolate;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
#grinderSplash::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,
    rgba(0,0,0,.08) 0%,rgba(0,0,0,.18) 46%,rgba(0,0,0,.48) 72%,rgba(0,0,0,.78) 100%);
}
#grinderSplash .gs-cards{
  position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  opacity:0;animation:gsCardsIn .9s .15s ease forwards;
}
#grinderSplash .gs-card{
  position:absolute;left:50%;
  --w:min(128vw,58vh,540px);
  width:var(--w);height:calc(var(--w)*1.4);
  top:calc(92% - var(--w)*1.4);margin-left:calc(var(--w)/-2);
  transform-origin:50% 100%;overflow:hidden;border-radius:24px;
  background:linear-gradient(155deg,rgba(13,20,36,.78) 0%,rgba(5,10,22,.76) 46%,rgba(0,2,8,.82) 100%);
  border:1.5px solid rgba(21,91,189,.48);
  box-shadow:-12px 0 40px rgba(0,0,0,.72),0 0 26px rgba(21,91,189,.12),
    inset 0 1px 0 rgba(140,185,255,.10),inset 0 0 52px rgba(0,0,0,.42);
  color:rgba(111,164,255,.30);
  text-shadow:0 0 16px rgba(21,91,189,.18),0 -1px 0 rgba(0,0,0,.7);
}
#grinderSplash .gs-card i{
  position:absolute;left:6%;top:4%;
  font:700 calc(var(--w)*.13)/.92 Georgia,'Times New Roman',serif!important;
  font-style:normal!important;text-align:center!important;color:rgba(111,164,255,.46)!important;
}
#grinderSplash .gs-card i.gs-r{left:auto;right:6%}
#grinderSplash .gs-card b{
  position:absolute;inset:0;display:grid;place-items:center;
  font:700 calc(var(--w)*.55)/1 Georgia,'Times New Roman',serif!important;
  opacity:.42!important;color:rgba(111,164,255,.40)!important;
}
#grinderSplash .gs-c1{transform:rotate(-24deg) translateX(-12%)}
#grinderSplash .gs-c2{transform:rotate(-8deg) translateX(-5%)}
#grinderSplash .gs-c3{transform:rotate(8deg) translateX(5%)}
#grinderSplash .gs-c4{transform:rotate(24deg) translateX(12%)}

#grinderSplash .gs-center{
  position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;
  width:min(100%,430px);padding:0 18px;transform-origin:50% 50%;
}
#grinderSplash .gs-logo{
  width:180px;height:180px;display:block;object-fit:contain;
  border-radius:50%;clip-path:circle(49.2% at 50% 50%);
  background:transparent!important;
  filter:drop-shadow(0 9px 16px rgba(0,0,0,.62)) drop-shadow(0 0 10px rgba(21,91,189,.18));
  will-change:transform,rotate,opacity;backface-visibility:hidden;
  animation:gsLogoPop 1s cubic-bezier(.2,1.4,.4,1) both,
            gsLogoSpin 1.4s .1s ease-out both;
}
#grinderSplash .gs-brand{
  margin-top:clamp(12px,2.6vh,26px);display:flex;flex-direction:column;align-items:center;
  transform:rotate(-5deg);transform-origin:50% 50%;
  opacity:0;animation:gsBrandIn .6s .9s cubic-bezier(.2,1.2,.4,1) forwards;
  will-change:transform,opacity;
}
#grinderSplash .gs-stackup{
  font-family:'GrinderSplashBrush','Bebrush',sans-serif!important;
  font-size:clamp(28px,9vw,40px)!important;font-weight:400!important;
  line-height:.9!important;letter-spacing:1.5px!important;white-space:nowrap!important;
  color:#ece9e4!important;text-shadow:0 4px 12px rgba(0,0,0,.65)!important;
}
#grinderSplash .gs-grinder{
  margin-top:.04em!important;
  font-family:'GrinderSplashRage','Road Rage','GrinderSplashBrush',sans-serif!important;
  font-size:clamp(64px,21vw,92px)!important;font-weight:400!important;
  line-height:.85!important;letter-spacing:2px!important;white-space:nowrap!important;
  background:linear-gradient(180deg,rgba(95,150,235,.98) 0%,rgba(21,91,189,.90) 42%,rgba(14,66,145,.72) 58%,rgba(55,120,215,.94) 100%)!important;
  -webkit-background-clip:text!important;background-clip:text!important;
  color:transparent!important;-webkit-text-fill-color:transparent!important;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.30)) drop-shadow(0 6px 14px rgba(21,91,189,.42))!important;
}

@keyframes gsCardsIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
@keyframes gsLogoPop{
  from{transform:scale(.3);opacity:0}
  to{transform:scale(1);opacity:1}
}
@keyframes gsLogoSpin{
  from{rotate:-180deg}
  to{rotate:0deg}
}
@keyframes gsBrandIn{
  from{opacity:0;transform:rotate(-5deg) translateY(14px) scale(.9)}
  to{opacity:1;transform:rotate(-5deg)}
}
@keyframes gsSimpleFade{
  from{opacity:0}
  to{opacity:1}
}

@media (max-width:390px){
  #grinderSplash .gs-logo{width:172px;height:172px}
}
@media (max-width:360px){
  #grinderSplash .gs-logo{width:164px;height:164px}
}
@media (prefers-reduced-motion:reduce){
  #grinderSplash .gs-cards,
  #grinderSplash .gs-logo,
  #grinderSplash .gs-brand{
    animation:gsSimpleFade .35s ease both!important;
  }
  #grinderSplash .gs-logo{transform:none!important;rotate:0deg!important}
  #grinderSplash .gs-brand{transform:rotate(-5deg)!important}
}
</style>

</head>

<style>
/* Fonte única embutida: Bebrush. */
@font-face{font-family:'Bebrush';src:url(assets/bebrush.otf) format('opentype');font-display:block}

:root{--brush:'Bebrush',sans-serif;--bubble:var(--brush)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{color-scheme:dark;background:#1a1a1a}
body{background:#1a1a1a;color:#fff;display:flex;justify-content:center;align-items:center;font-family:'Bebrush',sans-serif;-webkit-tap-highlight-color:transparent}
.screen{position:relative;width:100%;max-width:430px;height:100%;max-height:932px;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 24px);
  background:#9c9a95}
@media(min-width:500px){.screen{border-radius:44px;box-shadow:0 0 0 10px #0c0c0c,0 30px 80px rgba(0,0,0,.6)}}
/* ---- Concreto ---- */
.concrete{position:fixed;inset:0;z-index:0;pointer-events:none}
.concrete svg{width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.45) 100%)}
.content{position:relative;z-index:1;width:100%;min-height:100%;display:flex;flex-direction:column;align-items:center}
/* ---- Topo ---- */
.top{width:100%;display:flex;justify-content:flex-end;position:relative;z-index:10}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:2px solid rgba(255,255,255,.85);background:rgba(20,20,20,.55);color:#fff;font:400 16px var(--bubble);letter-spacing:1px;cursor:pointer;backdrop-filter:blur(4px)}
.lang-btn svg{width:18px;height:18px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#141414;border:2px solid #fff;border-radius:14px;overflow:hidden;display:none;min-width:160px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px;background:none;border:0;color:#fff;font:400 15px var(--brush);cursor:pointer}
.menu button:hover,.menu button.on{background:#2c2c2c}
/* ---- Título ---- */
.title{margin-top:1.2vh;font-family:var(--brush);font-size:clamp(80px,25vw,110px);line-height:1;color:#111;letter-spacing:2px;
  text-shadow:0 1px 0 rgba(255,255,255,.35),0 0 1px #000;transform:rotate(-3deg);mix-blend-mode:multiply}
.tag{margin-top:8px;font-family:var(--brush);font-size:15px;color:#f2f0ec;background:#111;padding:5px 14px;white-space:nowrap;font-size:clamp(11px,3.4vw,15px) !important;transform:rotate(-2deg);letter-spacing:.5px}
/* ---- Boas-vindas ---- */
.welcome{margin-top:3.2vh;text-align:center}
.welcome h2{font-family:var(--brush);font-size:36px;color:#111;letter-spacing:2px;font-weight:400}
.welcome p{margin-top:4px;font:400 11px var(--brush);letter-spacing:3px;color:#222;text-transform:uppercase}
.suits{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px;color:#111;font-size:15px}
.suits i{display:block;width:70px;height:2px;background:#111;opacity:.6}
.suits span.r{color:#8e1f16}
/* ---- Botões ---- */
.actions{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:4vh}
.btn{display:flex;align-items:center;gap:14px;width:100%;min-height:74px;padding:10px 16px 10px 12px;border-radius:18px;border:2px solid rgba(255,255,255,.9);background:rgba(16,16,16,.92);color:#fff;
  text-align:left;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.35),0 12px 26px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.3)}
.ic{flex:none;width:clamp(42px,12vw,50px);height:clamp(42px,12vw,50px);border-radius:50%;display:grid;place-items:center;background:#000;border:2px solid #fff}
.ic svg{width:28px;height:28px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txt b{font-family:var(--bubble);letter-spacing:.3px;font-weight:400;font-size:clamp(16px,4.8vw,20px);letter-spacing:.5px;line-height:1.1}
.txt small{font:400 15px var(--brush);opacity:.75;letter-spacing:.5px}
.chev{flex:none;width:22px;height:22px}
.btn.primary{background:#f2f0ec;color:#111;border-color:#111}
.btn.primary .ic{background:#111;color:#fff;border-color:#111}
.btn.wa .ic{border-color:#25D366}
/* ---- Logo ---- */
.logo{margin-top:.5vh;width:min(52vw,210px);aspect-ratio:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.logo img{width:100%;height:100%}
.legal{margin-top:auto;padding-top:16px;letter-spacing:.5px;font-size:11px;color:#2a2a2a;text-align:center;opacity:.8}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font:400 14px var(--brush);opacity:0;transition:.25s;z-index:5;border:1px solid #444;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---- Toques da referência: roxo + dourado ---- */
:root{--roxo:#7b2ff7;--roxo2:#4b12b8;--ouro:#f0a93b}
.btn{border:1.5px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(38,36,42,.95),rgba(14,13,16,.95));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.45)}
.btn.primary{background:linear-gradient(135deg,#8d45ff 0%,var(--roxo) 45%,var(--roxo2) 100%);color:#fff;border:1.5px solid #b98cff;
  box-shadow:0 0 0 1px rgba(123,47,247,.4),0 0 26px rgba(123,47,247,.65),0 10px 24px rgba(0,0,0,.45)}
.btn.primary .ic{background:rgba(20,6,50,.55);border-color:#c9a6ff}
.btn .ic{background:#0b0b0d;border:2px solid rgba(255,255,255,.25)}
.btn.wa .ic{border-color:#25D366;box-shadow:0 0 12px rgba(37,211,102,.45)}
.btn:active{transform:translateY(2px) scale(.99)}
.suits i{background:linear-gradient(90deg,transparent,var(--roxo));opacity:1}
.suits i:last-child{background:linear-gradient(90deg,var(--roxo),transparent)}
.suits span{color:var(--roxo)} .suits span.r{color:var(--roxo)} .suits span:nth-of-type(4){color:var(--ouro)}
.tag{background:#111;color:#fff;border:1.5px solid var(--ouro);box-shadow:0 0 14px rgba(240,169,59,.45)}
.logo{position:relative}

.legal a{color:var(--roxo2);font-weight:700;text-decoration:none}
.lang-btn{border-color:var(--roxo);box-shadow:0 0 14px rgba(123,47,247,.5)}
</style>

<script>
(function(){
  const tag=document.querySelector('.tag'),box=document.querySelector('.content');
  window.__grinderFit=function(){try{fit()}catch(e){}};
  function fit(){
    if(!tag||!box)return;
    const avail=box.clientWidth-20;               // largura útil com folga
    var B=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||12;
    tag.style.setProperty('font-size',B+'px','important');
    tag.style.setProperty('max-width','none','important');
    const nat=tag.getBoundingClientRect().width;
    let size=B;
    if(nat>avail) size=Math.max(9,Math.floor(B*avail/nat*10)/10);
    tag.style.setProperty('font-size',size+'px','important');
    tag.style.setProperty('max-width',avail+'px','important');
    let guard=40;while(tag.scrollWidth>tag.clientWidth+1&&guard--){size-=.3;tag.style.setProperty('font-size',size+'px','important');}
  }
  window.__fitTag=fit;
  window.addEventListener('resize',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(box);
  new MutationObserver(fit).observe(tag,{childList:true,characterData:true,subtree:true});
  if(document.fonts){document.fonts.load("14px Bebrush").then(fit).catch(()=>{});document.fonts.ready.then(fit);}
  [0,200,800,2000].forEach(t=>setTimeout(fit,t));
})();
</script>

  function spotSleep(ms){return new Promise(resolve=>window.setTimeout(resolve,ms));}
  function spotHistoryActor(entry){
    return String(entry?.position||entry?.actor||entry?.player||entry?.seat||'').toUpperCase();
  }
  function spotHistoryKind(entry){
    if(window.StackUpTableState?.normalizeActionKind)return window.StackUpTableState.normalizeActionKind(entry);
    const raw=String(entry?.kind||entry?.action||entry?.label||'').toLowerCase().replace(/[ _-]+/g,'');
    if(raw.includes('fold'))return 'fold';
    if(raw.includes('check'))return 'check';
    if(raw.includes('call'))return 'call';
    if(raw.includes('allin')||raw.includes('jam')||raw.includes('shove'))return 'jam';
    if(raw.includes('raise')||raw.includes('bet'))return 'raise';
    return raw||'unknown';
  }
  function spotHistoryLabel(entry){
    const kind=spotHistoryKind(entry);
    const labels={check:'CHECK',call:'CALL',fold:'FOLD',raise:'RAISE',bet:'BET',jam:'ALL IN'};
    let label=labels[kind]||String(entry?.action||entry?.label||kind||'').toUpperCase();
    const target=Number(entry?.to??entry?.target??entry?.amount??entry?.size);
    if((kind==='raise'||kind==='bet')&&Number.isFinite(target)&&target>0)label+=' '+fmtStack(target);
    return label;
  }
  function spotLastActionForPosition(position){
    const pos=String(position||'').toUpperCase();
    const visual=SPOT_VISUAL_ACTIONS.get(pos);
    if(visual)return visual;
    const history=Array.isArray(SOLVER_TABLE_STATE?.history)?SOLVER_TABLE_STATE.history:[];
    for(let i=history.length-1;i>=0;i--){
      if(spotHistoryActor(history[i])===pos)return history[i];
    }
    return null;
  }

  function launchSpotChipsFromSeat(seat,count,duration,spread){
    const center=tb.querySelector('.centerbox');
    if(!seat||!center)return;
    const hostRect=tb.getBoundingClientRect();
    const from=seat.querySelector('.av')?.getBoundingClientRect()||seat.getBoundingClientRect();
    const to=center.getBoundingClientRect();
    const sx=from.left+from.width/2-hostRect.left;
    const sy=from.top+from.height/2-hostRect.top;
    const tx=to.left+to.width/2-hostRect.left;
    const ty=to.top+to.height*.70-hostRect.top;
    for(let i=0;i<count;i++){
      const chip=document.createElement('i');
      chip.className='spotchipfx';
      chip.style.left=(sx+((i-(count-1)/2)*2.5))+'px';
      chip.style.top=(sy+(i%2?2:-2))+'px';
      tb.appendChild(chip);
      const dx=tx-sx+((i-(count-1)/2)*(spread||4));
      const dy=ty-sy+(i%2?3:-3);
      const delay=i*32;
      if(chip.animate){
        const anim=chip.animate([
          {transform:'translate(-50%,-50%) scale(.8)',opacity:.25},
          {transform:'translate(-50%,-50%) scale(1.1)',opacity:1,offset:.16},
          {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(.74)',opacity:.9}
        ],{duration:duration||700,delay,easing:'cubic-bezier(.2,.72,.25,1)',fill:'forwards'});
        anim.finished.catch(()=>{}).finally(()=>chip.remove());
      }else{
        window.setTimeout(()=>chip.remove(),(duration||700)+delay);
      }
    }
  }

    const seat=[...tb.querySelectorAll('.seat[data-pos]')].find(el=>String(el.dataset.pos).toUpperCase()===pos);

  function spotCanonicalActionOrder(street,positions){
    const available=new Set((positions||[]).map(x=>String(x).toUpperCase()));
    const pre=(available.size===2)
      ?['SB','BB']
      :['UTG','UTG+1','UTG+2','MP','LJ','HJ','CO','BTN','SB','BB'];
    const post=['SB','BB','UTG','UTG+1','UTG+2','MP','LJ','HJ','CO','BTN'];
    return (String(street||'').toUpperCase()==='PRE-FLOP'?pre:post).filter(p=>available.has(p));
  }
  function spotHistoryUntilHero(history,heroPosition){
    const hero=String(heroPosition||'').toUpperCase();
    if(!hero)return history||[];
    const out=[];
    for(const action of history||[]){
      if(spotHistoryActor(action)===hero)break;
      out.push(action);
    }
    return out;
  }

  async function playSpotDecisionSequence(spot){
    const token=++SPOT_DECISION_SEQUENCE_TOKEN;
    SPOT_DECISION_SEQUENCE_RUNNING=true;
    clearSpotActorAction();
    SPOT_VISUAL_FOLDS.clear();
    SPOT_VISUAL_ACTIONS.clear();
    const entry=currentSpotEntry();
    if(entry?.answer){
      SPOT_DECISION_SEQUENCE_RUNNING=false;
      setSpotActionsBusy(true);
      return;
    }
    setSpotActionsBusy(true);

    const scenario=spot?.scenario||{};
    const tablePositions=POSN[resolveSpotCount()]||POSN[10];
    const view=solverSpotView(tablePositions);
    if(window.StackUpTableState?.fromStreetStart&&view){
      SOLVER_TABLE_STATE=window.StackUpTableState.fromStreetStart(spot,view);
      renderTable();
      await spotSleep(80);
    }

    const currentStreetHistory=window.StackUpTableState?.historyForCurrentStreet?.(view,scenario);
    const raw=Array.isArray(currentStreetHistory)?currentStreetHistory:(Array.isArray(scenario.actionHistory)?scenario.actionHistory:[]);
    let history=raw.filter(a=>spotHistoryActor(a)&&['check','call','fold','raise','bet','jam'].includes(spotHistoryKind(a)));
    const street=String(scenario.street||'').toUpperCase().replace('PREFLOP','PRE-FLOP');
    const heroPos=String(view?.heroPosition||scenario.heroPosition||'').toUpperCase();

    // Nunca reproduzir ações depois que a decisão chegou ao herói.
    history=spotHistoryUntilHero(history,heroPos);

    // RFI sem histórico explícito: reconstruir folds pela ordem REAL de ação pré-flop,
    // e parar exatamente antes do herói.
    if(!history.length&&street==='PRE-FLOP'&&/rfi/i.test(String(spot?.id||scenario.solverNode||''))){
      const available=Array.isArray(view?.positions)&&view.positions.length
        ?view.positions
        :(Array.isArray(scenario.positions)?scenario.positions:tablePositions);
      const order=spotCanonicalActionOrder(street,available);
      const heroIndex=order.indexOf(heroPos);
      if(heroIndex>0)history=order.slice(0,heroIndex).map(position=>({position,kind:'fold',street}));
    }

    tb.querySelectorAll('.seat:not(.hero)').forEach(seat=>{
      seat.classList.remove('spot-state-folded','spot-state-allin','spot-acting');
      const cards=seat.querySelector('.backs');
      if(cards)cards.style.display='';
    });

    // Abertura do spot: alerta sonoro -> 1 segundo de pausa -> começa a mão.
    try{await window.StackUpPokerAudio?.unlock?.();}catch(_){}
    if(token!==SPOT_DECISION_SEQUENCE_TOKEN||tb.hidden)return;
    window.StackUpPokerAudio?.play?.('alert');
    await spotSleep(1000);
    if(token!==SPOT_DECISION_SEQUENCE_TOKEN||tb.hidden)return;

    for(const action of history){
      if(token!==SPOT_DECISION_SEQUENCE_TOKEN||tb.hidden)return;
      const kind=spotHistoryKind(action);
      const actor=spotHistoryActor(action);
      if(actor===heroPos)break;

      showSpotActorAction(action);

      if(SOLVER_TABLE_STATE&&window.StackUpTableState?.apply&&actor){
        try{
          window.StackUpTableState.apply(SOLVER_TABLE_STATE,actor,action);
          if(kind!=='fold')syncSpotTableStateDom();
          else window.setTimeout(()=>{
            if(token===SPOT_DECISION_SEQUENCE_TOKEN&&!tb.hidden)syncSpotTableStateDom();
          },520);
        }catch(_){}
      }

      // Uma ação por segundo, respeitando a sequência cronológica do histórico.
      await spotSleep(1000);
      if(token!==SPOT_DECISION_SEQUENCE_TOKEN||tb.hidden)return;
      clearSpotActorAction();
      syncSpotTableStateDom();
    }

    if(token!==SPOT_DECISION_SEQUENCE_TOKEN||tb.hidden)return;
    clearSpotActorAction();
    syncSpotTableStateDom();
    renderSpotActions();
    const hero=tb.querySelector('.seat.hero');
    hero?.classList.add('spot-turn');
    SPOT_DECISION_SEQUENCE_RUNNING=false;
    setSpotActionsBusy(false);
    window.StackUpPokerAudio?.play?.('hero');
  }

  const SPOT_SETUP_TEXT={

  function spotSetupRows(){
    const t=TR[L()],rows=[];
    const readable=value=>{
      try{return lab(value);}catch(_){return String(value||'');}
    };
    for(const section of SECS){
      if(section.tour&&!isTour())continue;
      const values=[];
      for(const group of section.groups){
        const raw=[...(sel[group.id]||[])];
        if(group.toggle){
          const active=raw.filter(v=>v!=='all'&&v!=='random');
          if(active.length)values.push(active.map(readable).join(', '));
          continue;
        }
        if(!raw.length||raw.includes('all')||raw.includes('random')){
          values.push(t.all);
        }else if(group.id==='hands'){
          values.push(raw[0]+' '+t.hands);
        }else{
          values.push(raw.map(readable).join(', '));
        }
      }
      const value=values.filter(Boolean).join(' · ');
      if(value)rows.push({label:t.sec[section.id]||section.id,value});
    }
    const advanceNames=[];
    for(const section of ADV_SECS){
      if(section.tour&&!isTour())continue;
      const active=section.groups.flatMap(group=>[...(sel[group.id]||[])])
        .filter(v=>v!=='all'&&v!=='random');
      advanceNames.push(...active.map(readable));
    }
    if(advanceNames.length){
      const tx=SPOT_SETUP_TEXT[L()]||SPOT_SETUP_TEXT.pt;
      rows.push({
        label:tx.advance,
        value:[...new Set(advanceNames)].join(', ')
      });
    }
    return rows;
  }

  function trainingStatsSections(){
    const names=[];
    for(const section of ADV_SECS){
      if(section.tour&&!isTour())continue;
      for(const group of section.groups){
        for(const value of [...(sel[group.id]||[])]){
          if(value!=='all'&&value!=='random')names.push(lab(value));
        }
      }
    }
    if(names.length)return [...new Set(names)];
    const streets=[...(sel.street||[])].filter(x=>x!=='all'&&x!=='random').map(lab);
    if(streets.length)return streets;
    const positions=[...(sel.pos||[])].filter(x=>x!=='all'&&x!=='random').map(lab);
    if(positions.length)return positions;
    return [L()==='en'?'GENERAL':L()==='es'?'GENERAL':'GERAL'];
  }
  function trainingStatsLabel(){
    const sections=trainingStatsSections();
    if(sections.length===1&&sections[0]!=='GERAL'&&sections[0]!=='GENERAL')return sections[0];
    const advanced=ADV_SECS.some(section=>section.groups.some(group=>[...(sel[group.id]||[])].some(v=>v!=='all'&&v!=='random')));
    if(advanced)return (L()==='en'?'ADVANCE TRAINING':L()==='es'?'ENTRENO ADVANCE':'TREINO ADVANCE');

    const spot=SOLVER_SPOT||await loadSolverSpot(false);
    if(cur!=='spots'||sub.spots.length||!SPOT_TRAINING_STARTED)return;

  function primeSpotAnalysisCache(spot){

  function seatPointOutside(feltLeft,top,feltW,feltH,k,n,W,H){
    // 10 jogadores igualmente distribuidos ao redor da elipse.
    // O CENTRO de cada avatar nasce na borda e e empurrado para fora
    // pela normal local o suficiente para o circulo inteiro ficar fora.
    const cx=feltLeft+feltW/2,cy=top+feltH/2;
    const rx=feltW/2,ry=feltH/2;

    // aproxima angulos por comprimento de arco para espacamento visual uniforme
    const steps=720;
    const pts=[];
    let total=0,px=cx,py=cy+ry;
    for(let i=0;i<=steps;i++){
      const a=Math.PI/2+(Math.PI*2*i/steps);
      const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;
      if(i>0)total+=Math.hypot(x-px,y-py);
      pts.push([a,total]);
      px=x;py=y;
    }
    const target=(total*k)/n;
    let lo=0,hi=pts.length-1;
    while(lo<hi){
      const mid=(lo+hi)>>1;
      if(pts[mid][1]<target)lo=mid+1;else hi=mid;
    }
    const a=pts[Math.min(lo,pts.length-1)][0];
    const ca=Math.cos(a),sa=Math.sin(a);

    // ponto exato no arco da mesa
    const bx=cx+ca*rx,by=cy+sa*ry;

    // normal externa da elipse
    let nx=ca/Math.max(rx,1),ny=sa/Math.max(ry,1);
    const nl=Math.hypot(nx,ny)||1;
    nx/=nl;ny/=nl;

    // avatar = 44px (raio 22). Aro/glow ~11px + 7px de respiro.
    const clearance=40;
    const x=bx+nx*clearance;
    const y=by+ny*clearance;

    // limites só evitam corte do avatar pela tela; não alteram a mesa.
    const minX=48,maxX=Math.max(minX,W-48);
    const minY=68,maxY=Math.max(minY,H-46);
    return [
      Math.max(minX,Math.min(maxX,x)),
      Math.max(minY,Math.min(maxY,y-(k===0?37:0)))
    ];
  }

  function solverRaisePreset(uiAction,label){
    try{
      const engine=window.StackUpSpotsEngine;
      if(!SOLVER_SPOT||!engine)return {label,value:'—',available:false};
      const pos=POSN[resolveSpotCount()]||POSN[10];
      const view=solverSpotView(pos);
      const strategy=view?engine.strategyForHand?.(SOLVER_SPOT,view.handKey):null;
      const mapped=strategy?engine.mapUiActions?.(strategy.actions):null;
      const action=mapped?.[uiAction]||null;
      if(!action)return {label,value:'—',available:false};

      const heroPos=view?.heroPosition||SOLVER_SPOT?.scenario?.heroPosition;
      const target=window.StackUpTableState?.resolveActionTarget?.(SOLVER_TABLE_STATE,heroPos,action);
      const raw=String(action.action||action.label||'');
      const pctMatch=raw.match(/(\d+(?:\.\d+)?)\s*%/);
      const fractionMatch=raw.match(/bet\s+(\d+)\s*\/\s*(\d+)/i);
      let solverSize='';
      if(pctMatch)solverSize=String(Number(pctMatch[1]).toLocaleString(L()==='en'?'en-US':'pt-BR'))+'%';
      else if(fractionMatch&&Number(fractionMatch[2]))solverSize=Math.round(Number(fractionMatch[1])/Number(fractionMatch[2])*100)+'%';

      const amount=Number.isFinite(Number(target))?fmtStack(Number(target)):'';
      const buttonLabel=solverSize?('RAISE '+solverSize):label;
      return {label:buttonLabel,value:amount,available:true,action};
    }catch(_){
      return {label,value:'—',available:false};
    }
  }

  function launchSpotChips(count,duration,spread){
    const hero=tb.querySelector('.seat.hero');
    const center=tb.querySelector('.centerbox');
    if(!hero||!center||typeof Element==='undefined')return;
    const hostRect=tb.getBoundingClientRect();
    const from=hero.getBoundingClientRect();
    const to=center.getBoundingClientRect();
    const sx=from.left+from.width/2-hostRect.left;
    const sy=from.top+from.height/2-hostRect.top;
    const tx=to.left+to.width/2-hostRect.left;
    const ty=to.top+to.height*.72-hostRect.top;
    for(let i=0;i<count;i++){
      const chip=document.createElement('i');
      chip.className='spotchipfx';
      chip.style.left=(sx+((i-(count-1)/2)*3))+'px';
      chip.style.top=(sy+(i%2?2:-2))+'px';
      tb.appendChild(chip);
      const dx=tx-sx+((i-(count-1)/2)*(spread||3));
      const dy=ty-sy+(i%2?3:-3);
      const delay=i*34;
      if(chip.animate){
        const anim=chip.animate([
          {transform:'translate(-50%,-50%) scale(.82)',opacity:.2},
          {transform:'translate(-50%,-50%) scale(1.08)',opacity:1,offset:.18},
          {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(.78)',opacity:.94}
        ],{duration:duration||620,delay,easing:'cubic-bezier(.2,.72,.25,1)',fill:'forwards'});
        anim.finished.catch(()=>{}).finally(()=>chip.remove());
      }else{
        window.setTimeout(()=>chip.remove(),(duration||620)+delay);
      }
    }
  }

  function playSpotTableAction(action){
    cancelSpotDecisionSequence();
    const soundKind=action==='allin'?'jam':String(action||'').startsWith('raise')?'raise':action;
    window.StackUpPokerAudio?.play?.(soundKind);
    const hero=tb.querySelector('.seat.hero');
    const hand=hero?.querySelector('.herohand');
    const center=tb.querySelector('.centerbox');
    if(!hero)return 180;

    ['spot-check','spot-call','spot-raise','spot-allin','spot-fold'].forEach(x=>hero.classList.remove(x));
    hand?.classList.remove('spot-fold-cards');
    center?.classList.remove('spot-pot-hit','spot-pot-allin');

    if(action==='fold'){
      animateSpotFoldCards(hero);
      return 760;
    }
    if(action==='check'){
      hero.classList.add('spot-check');
      return 560;
    }
    if(action==='call'){
      hero.classList.add('spot-call');
      center?.classList.add('spot-pot-hit');
      launchSpotChips(4,620,3);
      return 690;
    }
    if(action==='allin'){
      hero.classList.add('spot-allin');
      center?.classList.add('spot-pot-allin');
      launchSpotChips(9,820,5);
      return 920;
    }
    hero.classList.add('spot-raise');
    center?.classList.add('spot-pot-hit');
    launchSpotChips(action==='raise2'?7:action==='raise1'?6:5,720,4);
    return 790;
  }

  function renderTable(){
    const W=tb.clientWidth,H=tb.clientHeight;if(!W||!H)return;
    // Mesa GRANDE: ocupa o centro; jogadores usam a faixa externa, sem reduzir o feltro.
    const feltLeft=Math.max(64,W*.17),feltRight=W-feltLeft;
    const top=Math.max(54,H*.095),bot=H-Math.max(58,H*.095);
    const feltW=feltRight-feltLeft,feltH=bot-top;
    if(!SPOT_TRAINING_STARTED){
      tb.innerHTML=renderSpotSetup();
      return;
    }
    if(solverSpotLoading&&!SOLVER_SPOT){
      tb.innerHTML=`<div class="felt" style="left:${feltLeft}px;top:${top}px;width:${feltW}px;height:${feltH}px"></div><div class="spotintro loading"><i></i><span>${L()==='en'?'LOADING TRAINING':L()==='es'?'CARGANDO ENTRENO':'CARREGANDO TREINO'}</span></div>`;
      return;
    }
    if(!SOLVER_SPOT){
      tb.innerHTML=`<div class="felt" style="left:${feltLeft}px;top:${top}px;width:${feltW}px;height:${feltH}px"></div>`;
      return;
    }
    const n=resolveSpotCount(),pos=POSN[n]||POSN[9];
    const solved=solverSpotView(pos);
    const heroPos=resolveHeroPosition(pos),h0=Math.max(0,pos.indexOf(heroPos));

    let html=`<div class="felt" style="left:${feltLeft}px;top:${top}px;width:${feltW}px;height:${feltH}px"></div>`;
    const heroCards=solved&&solved.heroCards.length>=2?solved.heroCards:[];

    for(let k=0;k<n;k++){
      const p=pos[(h0+k)%n],hero=k===0,[x,y]=seatPointOutside(feltLeft,top,feltW,feltH,k,n,W,H);
      const hand=hero
        ?`<div class="herohand">${heroCards.map(card).join('')}</div>`
        :'<div class="backs" aria-hidden="true"><i></i><i></i></div>';
      const statePlayer=SOLVER_TABLE_STATE?.players?.find(x=>x.position===p)||null;
      const stack=statePlayer
        ?Number(statePlayer.stack)
        :(solved&&Number.isFinite(Number(solved.stackForPosition[p]))
          ?Number(solved.stackForPosition[p])
          :DEMO_STK[k%DEMO_STK.length]);
      const settled=!!currentSpotEntry()?.answer;
      const stateClass=statePlayer?((statePlayer.folded&&settled)?' spot-state-folded':'')+(statePlayer.allIn?' spot-state-allin':''):'';
      const lastAction=spotLastActionForPosition(p);
      const actionText=spotVisualActionLabel(lastAction);
      const actionCard=hero
        ?`<div class="spotactiontext heroaction">${spotEscape(actionText)}</div>`
        :`<div class="spotactiontext">${spotEscape(actionText)}</div>`;
      html+=`<div class="seat${hero?' hero':''}${stateClass}" data-pos="${p}" style="left:${x}px;top:${y}px">${hero?actionCard:''}${hand}<div class="playerbox"><div class="av" data-pos="${p}">${p}</div><div class="stk">${fmtStack(stack)}</div>${hero?'':actionCard}</div></div>`;


    }

    const cy=top+feltH*.45-18;
    const boardCards=solved?solved.board:DEMO_BOARD;
    const boardSlots=solved?[...boardCards,...Array(Math.max(0,5-boardCards.length)).fill(null)].slice(0,5):boardCards;
    const potValue=SOLVER_TABLE_STATE?Number(SOLVER_TABLE_STATE.pot)||0:(solved?Number(solved.pot)||0:DEMO_BETS.reduce((sum,v)=>sum+v,0));
    const sidePots=solved&&Array.isArray(solved.sidePots)?solved.sidePots:[];
    const pots=[`<div class="potline">${TR[L()].pot}: ${fmtStack(potValue)}</div>`];
    sidePots.forEach((value,i)=>{
      if(Number(value)>0)pots.push(`<div class="potline side">${TR[L()].side} ${i+1}: ${fmtStack(Number(value))}</div>`);
    });
    html+=`<div class="centerbox" style="top:${cy}px"><div class="board">${boardSlots.map(card).join('')}</div>${pots.join('')}</div>`;
    tb.innerHTML=html;
    paintSpotActorAction();
  }

  function setSelection(id,values,fallback){
    const S=sel[id]; if(!S)return;
    S.clear();
    const vals=Array.isArray(values)?values.filter(Boolean):(values?[values]:[]);
    if(vals.length)vals.forEach(v=>S.add(String(v))); else if(fallback)S.add(fallback);

  function applySavedFilters(filters){
    const f=filters||{};
    if(f.gameType)setSelection('mode',f.gameType==='CASH'?'cash':'mtt','mtt');
    if(f.seats)setSelection('seats',f.seats,'all');
    if(f.tournamentType)setSelection('ttype',f.tournamentType,'all');
    if(f.fieldSize)setSelection('fsize',f.fieldSize,'all');
    if(f.opponentProfile)setSelection('fskill',f.opponentProfile,'all');
    if(Number.isFinite(Number(f.sampleSize)))setSelection('hands',String(Number(f.sampleSize)),'100');
    if(Array.isArray(f.extras))setSelection('extras',f.extras,null);
    const phases=Array.isArray(f.phases)&&f.phases.length?f.phases:(f.phase?[f.phase]:[]);
    setSelection('phase',phases.length?phases:['all'],'all');
    const positions=Array.isArray(f.heroPositions)&&f.heroPositions.length?f.heroPositions:(f.heroPosition?[f.heroPosition]:[]);
    setSelection('pos',positions.length?positions:['all'],'all');
    const streets=(Array.isArray(f.streets)&&f.streets.length?f.streets:(f.street?[f.street]:[])).map(x=>x==='PRE-FLOP'?'pre':String(x).toLowerCase());
    setSelection('street',streets.length?streets:['all'],'all');
    const stacks=(Array.isArray(f.effectiveStacks)&&f.effectiveStacks.length?f.effectiveStacks:(f.effectiveStack?[f.effectiveStack]:[])).map(x=>String(Number(x))+'bb');
    setSelection('stack',stacks.length?stacks:['all'],'all');
    let special=f.special||{};
    if(typeof special==='string'){try{special=JSON.parse(special);}catch(_){special={};}}
    ADV_SECS.forEach(s=>{
      const values=Array.isArray(special?.[s.id])?special[s.id]:[];
      setSelection(s.id,values.length?values:['all'],'all');

  function applyIncomingPrescription(idOrEnvelope){
    const env=typeof idOrEnvelope==='object'&&idOrEnvelope?idOrEnvelope:

    if(!env||env.type!=='training_prescription')return false;
    const payload=env.payload||{};
    const filters=payload.grinderFilters||payload.filters||{};

      priority:String(payload.priority||''),
      profileVersion:payload.profileVersion||null,
      receivedAt:new Date().toISOString()

    grinderBridge?.acknowledge?.(env,'accepted',{prescriptionId:ACTIVE_STACKUP_PRESCRIPTION.id});

  function resumeSavedTraining(item){
    const snap=item?.snapshot||{},spot=snap.currentSpot;
    if(!spot)return false;
    applySavedFilters(snap.filters||{});
    resetSpotTimeline();
    SOLVER_FILTER_KEY=window.StackUpTrainingSequencer?.filterKey?.(buildSolverSpotFilters())||JSON.stringify(buildSolverSpotFilters());
    SOLVER_SPOT=cloneSpotValue(spot);
    SOLVER_TABLE_STATE=buildTableStateForSpot(SOLVER_SPOT);
    const entry=appendSpotTimeline(SOLVER_SPOT);
    if(snap.currentAnswer){
      entry.answer=cloneSpotValue(snap.currentAnswer);
      try{
        const pos=POSN[resolveSpotCount()]||POSN[10],view=solverSpotView(pos);
        entry.answer.analysis=window.StackUpSpotCoach?.analyze?.({
          spot:SOLVER_SPOT,view,result:entry.answer.result,uiAction:entry.answer.uiAction,
          tableState:entry.answer.tableStateBefore||SOLVER_TABLE_STATE,language:L()
        })||entry.answer.analysis;
        if(entry.answer.tableStateAfter)SOLVER_TABLE_STATE=cloneSpotValue(entry.answer.tableStateAfter);

    }

    SPOT_TRAINING_STARTED=true;

      const meta=tx.saved+' '+formatHistoryDate(item.updatedAt||item.createdAt)+' · '+tx.visited+' '+String(snap.visited||1)+(ans?.analysis?.title?' · '+ans.analysis.title:'');

      return {name:labelFn?labelFn(x.name):x.name,now:x.grade.score,before:prev?.grade?.score??null,total:x.counts.total,delta:prev?x.grade.score-prev.grade.score:null};

    const body=rows.length?rows.map(x=>'<div class="statsevorow"><b>'+statsEsc(x.name)+'</b><span>'+statsPct(x.now)+'</span>'+(x.delta===null?'<span class="statsdelta flat">N/D</span>':statsDeltaHtml(x.delta,' pp'))+'</div>').join(''):'<div class="statscallout">'+(L()==='en'?'Not enough comparative data yet.':L()==='es'?'Aún no hay suficientes datos comparativos.':'Ainda não há dados comparativos suficientes.')+'</div>';

  function statsCoverageHtml(records){

    const specs=[
      {name:L()==='en'?'POSITIONS':L()==='es'?'POSICIONES':'POSIÇÕES',all:['SB','BB','UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN'],obs:observedPos},

      {name:L()==='en'?'STACKS':L()==='es'?'STACKS':'STACKS',all:[5,10,15,18,20,25,30,50,100],obs:observedStack,fmt:x=>x+'BB'},
      {name:L()==='en'?'PHASES':L()==='es'?'FASES':'FASES',all:['early','middle','bubble','late','ft'],obs:observedPhase,fmt:x=>({early:'EARLY',middle:'MIDDLE',bubble:'BUBBLE',late:'LATE',ft:'FINAL TABLE'}[x]||x)}

  function statsEvolutionHtml(records,model){

    const last7=statsCounts(statsPeriod(records,7,0)),prev7=statsCounts(statsPeriod(records,7,7));

  function statsReportText(model){
    const tx=statsText(),c=model.overall,d=model.deep||{};
    const lines=['STACKUP HOLD\'EM GRINDER — '+tx.report,'',tx.spots+': '+c.total,tx.correct+': '+c.correct,tx.adjustable+': '+c.adjustable,tx.incorrect+': '+c.incorrect,tx.accuracy+': '+c.accuracy.toFixed(1)+'%','','GRADUAÇÃO POR ASSUNTO'];
    model.bySection.forEach(x=>lines.push(x.name+': '+x.grade.grade+' · '+x.counts.total+' spots · '+x.counts.accuracy.toFixed(1)+'% '+tx.accuracy.toLowerCase()));
    const add=(title,items)=>{
      lines.push('',title);
      (items||[]).forEach((x,i)=>{
        lines.push((i+1)+'. '+x.name+' · '+x.evidence);
        lines.push('   '+x.comment);
        lines.push('   '+(L()==='en'?'RISK: ':L()==='es'?'RIESGO: ':'RISCO: ')+x.risk);
        lines.push('   '+(L()==='en'?'ACTION: ':L()==='es'?'ACCIÓN: ':'AÇÃO: ')+x.action);
      });
    };
    add(tx.weaknesses,d.weaknesses);
    add(tx.threats,d.threats);
    add(tx.opportunities,d.opportunities);
    add(tx.strengths,d.strengths);
    lines.push('',tx.improve);
    model.plan.forEach((x,i)=>lines.push((i+1)+'. '+x));
    if(d.accessMessage)lines.push('',d.accessMessage);
    return lines.join('\n');
  }

<script>
/* PADRÃO GRINDER: texto sempre 12px, mesmo com "tamanho da fonte" do celular aumentado.
   O Android amplia o texto das páginas pelo tamanho de fonte do sistema; aqui medimos essa
   ampliação (texto da página × canvas, que não é ampliado) e compensamos no token --fs. */
(function(){
  function fix(){
    try{
      var s=document.createElement('span');
      s.textContent='MMMMMMMMMM';
      s.style.cssText='position:absolute;left:-9999px;top:0;font:100px monospace;white-space:nowrap;visibility:hidden';
      document.body.appendChild(s);
      var dom=s.getBoundingClientRect().width; s.remove();
      var ctx=document.createElement('canvas').getContext('2d'); ctx.font='100px monospace';
      var ref=ctx.measureText('MMMMMMMMMM').width;
      var r=dom/ref;
      if(!(r>0))return;
      var fs=(r>1.04&&r<3)?(12/r).toFixed(2)+'px':'12px';
      document.documentElement.style.setProperty('--fs',fs,'important');
      var h=document.getElementById('app2'); if(h) h.style.setProperty('--fs',fs,'important');
      window.__grinderTextZoom=r; if(window.__grinderFit)window.__grinderFit();
    }catch(e){}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fix);else fix();
  window.addEventListener('load',fix); window.addEventListener('resize',fix);
})();

<script>
/* PADRAO VISUAL GLOBAL: exibir o digito 0 como letra O, sem alterar valores internos. */
(function(){
  const SKIP=new Set(['SCRIPT','STYLE','INPUT','TEXTAREA','SELECT','OPTION']);
  const seen=new WeakSet();

  function convertTextNode(node){
    const p=node.parentElement;
    if(!p||SKIP.has(p.tagName))return;
    if(node.nodeValue&&node.nodeValue.includes('0')){
      node.nodeValue=node.nodeValue.replace(/0/g,'O');
    }
  }

  function convertTree(root){
    if(!root)return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let n;
    while((n=w.nextNode()))convertTextNode(n);
  }

  function watch(root){
    if(!root||seen.has(root))return;
    seen.add(root);
    convertTree(root);
    new MutationObserver(ms=>{
      for(const m of ms){
        if(m.type==='characterData'){
          convertTextNode(m.target);
          continue;
        }
        for(const n of m.addedNodes){
          if(n.nodeType===Node.TEXT_NODE) convertTextNode(n);
          else if(n.nodeType===Node.ELEMENT_NODE||n.nodeType===Node.DOCUMENT_FRAGMENT_NODE) convertTree(n);
        }
      }
    }).observe(root,{subtree:true,childList:true,characterData:true});
  }

  watch(document.body);
  const host=document.getElementById('app2');
  if(host&&host.shadowRoot)watch(host.shadowRoot);
})();
</script>

    bio.classList.remove('login-disabled');
    bio.setAttribute('aria-disabled','false');
    bio.tabIndex=0;
    bio.addEventListener('click',enterGrinder,true);
  }
})();
</script>

<script id="biometricEntryOverride">
(function(){
  function bind(){
    var old=document.getElementById('biometricLoginCard');
    if(!old)return;
    var bio=old.cloneNode(true);
    old.replaceWith(bio);
    bio.disabled=false;
    bio.removeAttribute('disabled');
    bio.classList.remove('login-disabled');
    bio.setAttribute('aria-disabled','false');
    bio.tabIndex=0;

    var entered=false;
    function enter(e){
      if(e){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();}
      if(entered)return;
      entered=true;
      bio.classList.add('on');

      var app=document.getElementById('app2');
      var login=document.querySelector('main.screen');
      if(!app){entered=false;return;}

      // Torna o container visível antes de chamar a lógica interna.
      app.hidden=false;
      app.removeAttribute('hidden');
      app.style.display='flex';
      if(login){login.inert=true;login.style.display='none';}

      try{
        if(typeof app.grinderEnter==='function')app.grinderEnter();
      }catch(_){
        // O container já está aberto; não devolver o usuário ao login.
      }

      // Garantia final para navegadores Android/TWA.
      app.hidden=false;
      app.removeAttribute('hidden');
      app.style.display='flex';
      if(login){login.inert=true;login.style.display='none';}
    }

    bio.addEventListener('click',enter,{capture:true});
    bio.addEventListener('pointerup',enter,{capture:true});
    bio.addEventListener('touchend',enter,{capture:true,passive:false});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});
  else bind();
})();
</script>
<script id="grinderSplashScript">
/* GRINDER splash timing mirrors the WRAPS opening while remaining isolated. */
(function(){
  var splash=document.getElementById('grinderSplash');
  if(!splash)return;

  var center=document.getElementById('grinderSplashCenter');
  var logo=document.getElementById('grinderSplashLogo');
  var brand=document.getElementById('grinderSplashBrand');
  var cards=document.getElementById('grinderSplashCards');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var exitAt=reduce?900:2300;

  function beginExit(){
    if(!splash||!splash.isConnected)return;

    /* Freeze the final entry state before removing animations so they cannot
       override the exit transition. Then force reflow, as in the WRAPS logic. */
    if(logo){
      logo.style.opacity='1';
      logo.style.transform='scale(1)';
      logo.style.rotate='0deg';
      logo.style.animation='none';
    }
    if(brand){
      brand.style.opacity='1';
      brand.style.transform='rotate(-5deg)';
      brand.style.animation='none';
    }
    if(cards){
      cards.style.opacity='1';
      cards.style.transform='none';
      cards.style.animation='none';
    }

    void splash.offsetWidth;

    if(center){
      center.style.transition=reduce?'opacity .35s ease':'opacity .35s ease,transform .35s ease';
      center.style.opacity='0';
      if(!reduce)center.style.transform='scale(.94)';
    }

    window.setTimeout(function(){
      splash.style.transition='opacity .5s ease';
      splash.style.opacity='0';

      window.setTimeout(function(){
        if(splash&&splash.parentNode)splash.parentNode.removeChild(splash);
        var style=document.getElementById('grinderSplashStyle');
        var script=document.getElementById('grinderSplashScript');
        if(style&&style.parentNode)style.parentNode.removeChild(style);
        if(script&&script.parentNode)script.parentNode.removeChild(script);
      },500);
    },320);
  }

  window.setTimeout(beginExit,exitAt);
})();
</script>
